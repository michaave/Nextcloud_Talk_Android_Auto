name: Android Auto - apply call bridge

on:
  push:
    branches:
      - android-auto
    paths:
      - .github/workflows/android-auto-apply-call-bridge.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: android-auto
          fetch-depth: 0

      - name: Apply shared Talk call bridge patches
        run: python3 scripts/android-auto-wire-call-bridge.py

      - name: Commit source wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/nextcloud/talk/jobs/NotificationWorker.kt \
                  app/src/main/java/com/nextcloud/talk/activities/CallActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m "feat(auto): wire Talk call lifecycle to Telecom"
          fi
          git fetch origin android-auto
          git rebase origin/android-auto

      - name: Compile gplay debug Kotlin
        id: compile
        run: |
          set +e
          ./gradlew :app:compileGplayDebugKotlin --stacktrace > /tmp/android-auto-call-build.log 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record compiler result
        run: |
          set -euo pipefail
          rc='${{ steps.compile.outputs.rc }}'
          if [ "$rc" = "0" ]; then result="PASS"; else result="FAIL"; fi
          {
            echo "# Android Auto call bridge build"
            echo
            echo "Result: **$result**"
            echo
            echo '```text'
            tail -n 240 /tmp/android-auto-call-build.log
            echo '```'
          } > ANDROID_AUTO_CALL_BUILD_STATUS.md
          git add ANDROID_AUTO_CALL_BUILD_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "ci(auto): record call bridge compile result"
          fi

      - name: Rebase and push results
        run: |
          set -euo pipefail
          git fetch origin android-auto
          git rebase origin/android-auto
          git push origin HEAD:android-auto
