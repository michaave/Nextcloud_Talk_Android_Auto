name: Android Auto - validate outgoing calls

on:
  push:
    branches:
      - android-auto-outgoing-calls
    paths:
      - .github/workflows/android-auto-validate-outgoing.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: android-auto-outgoing-calls
          fetch-depth: 0

      - name: Format imported notification condition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/nextcloud/talk/jobs/NotificationWorker.kt')
          text = path.read_text()
          old = '        if ((TYPE_CHAT == pushMessage.type || TYPE_REMINDER == pushMessage.type) && pushMessage.notificationUser != null) {\n'
          new = (
              '        if ((TYPE_CHAT == pushMessage.type || TYPE_REMINDER == pushMessage.type) &&\n'
              '            pushMessage.notificationUser != null\n'
              '        ) {\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Notification condition did not match expected source')
          path.write_text(text)
          PY

      - name: Commit formatting patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/nextcloud/talk/jobs/NotificationWorker.kt
          if ! git diff --cached --quiet; then
            git commit -m $'style(auto): wrap messaging notification condition\n\nAssisted-by: ChatGPT:GPT-5.6-Sol'
          fi

      - name: Compile Android Auto flavors
        run: ./gradlew :app:compileGplayDebugKotlin :app:compileGenericDebugKotlin --stacktrace

      - name: Run Kotlin style check
        run: ./gradlew ktlintCheck --stacktrace

      - name: Push source patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin android-auto-outgoing-calls
          git rebase origin/android-auto-outgoing-calls
          git push origin HEAD:android-auto-outgoing-calls
