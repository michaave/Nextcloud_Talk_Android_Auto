name: Android Auto test APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-auto
    paths:
      - app/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - gradle.properties
      - .github/workflows/android-auto-apk.yml

permissions: read-all

concurrency:
  group: android-auto-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Assemble GPlay debug APK
        run: ./gradlew --no-daemon :app:assembleGplayDebug --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/gplay/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No GPlay debug APK was produced"
            exit 1
          fi
          printf 'Built APK: %s\n' "${apks[@]}"

      - name: Upload Android Auto APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Nextcloud-Talk-Android-Auto-Gplay-Debug
          path: app/build/outputs/apk/gplay/debug/*.apk
          if-no-files-found: error
          retention-days: 14
