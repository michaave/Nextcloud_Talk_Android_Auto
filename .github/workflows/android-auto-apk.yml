name: Android Auto test APK and Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - android-auto
      - android-auto-carappservice
    paths:
      - app/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - gradle.properties
      - .github/workflows/android-auto-apk.yml

permissions: read-all

concurrency:
  group: android-auto-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Remove stale build output
        run: rm -rf app/build build .gradle

      - name: Verify Android Auto regressions and generic flavor
        run: >-
          ./gradlew --no-daemon :app:testGplayDebugUnitTest
          --tests 'com.nextcloud.talk.auto.*'
          --tests 'com.nextcloud.talk.conversationlist.ui.ConversationAvatarContentTest'
          :app:compileGenericDebugKotlin --stacktrace

      - name: Upload regression test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Android-Auto-regression-tests
          path: app/build/reports/tests/testGplayDebugUnitTest/
          if-no-files-found: ignore

      - name: Assemble GPlay debug APK from clean sources
        run: ./gradlew --no-daemon --no-build-cache clean -PandroidAutoSideBySide=true :app:assembleGplayDebug --stacktrace

      - name: Verify intended CarAppService
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/gplay/debug -maxdepth 1 -type f -name '*.apk' | head -n1)
          [ -n "$apk" ] || { echo 'No GPlay debug APK was produced'; exit 1; }
          mkdir -p /tmp/apk-dex
          cd /tmp/apk-dex
          unzip -q "$GITHUB_WORKSPACE/$apk" 'classes*.dex'
          if strings classes*.dex | grep -Fq 'Lcom/nextcloud/talk/androidauto/TalkCarAppService;'; then
            echo 'ERROR: obsolete diagnostic TalkCarAppService is packaged'
            exit 1
          fi
          strings classes*.dex | grep -Fq 'Lcom/nextcloud/talk/auto/TalkCarAppService;' || {
            echo 'ERROR: real TalkCarAppService is missing'; exit 1;
          }
          echo 'Verified intended Talk CarAppService.'

      - name: Reconstruct and validate persistent signing key
        shell: bash
        env:
          ANDROID_AUTO_KEYSTORE_BASE64: ${{ secrets.ANDROID_AUTO_KEYSTORE_BASE64 }}
          ANDROID_AUTO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_AUTO_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${ANDROID_AUTO_KEYSTORE_BASE64:-}" ] || { echo 'Missing keystore secret'; exit 1; }
          [ -n "${ANDROID_AUTO_KEYSTORE_PASSWORD:-}" ] || { echo 'Missing keystore password'; exit 1; }
          printf '%s' "$ANDROID_AUTO_KEYSTORE_BASE64" | base64 --decode > /tmp/talk-auto-signing.jks
          chmod 600 /tmp/talk-auto-signing.jks
          keytool -list -keystore /tmp/talk-auto-signing.jks -storepass "$ANDROID_AUTO_KEYSTORE_PASSWORD" -alias talk-auto >/dev/null

      - name: Sign APK with persistent Talk Auto key
        shell: bash
        env:
          ANDROID_AUTO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_AUTO_KEYSTORE_PASSWORD }}
          ANDROID_AUTO_KEY_PASSWORD: ${{ secrets.ANDROID_AUTO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_apk=$(find app/build/outputs/apk/gplay/debug -maxdepth 1 -type f -name '*.apk' ! -name '*talk-auto-signed.apk' | head -n1)
          signed_apk=app/build/outputs/apk/gplay/debug/app-gplay-debug-talk-auto-signed.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$apksigner" sign \
            --ks /tmp/talk-auto-signing.jks \
            --ks-key-alias talk-auto \
            --ks-pass env:ANDROID_AUTO_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_AUTO_KEY_PASSWORD \
            --out "$signed_apk" "$unsigned_apk"
          "$apksigner" verify --verbose --print-certs "$signed_apk"

      - name: Upload signed Android Auto APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Nextcloud-Talk-Android-Auto-Gplay-Debug-PersistentSigned
          path: app/build/outputs/apk/gplay/debug/app-gplay-debug-talk-auto-signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Play release identity and monotonically increasing version
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- app/build.gradle.kts
          rm -rf app/build build .gradle
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('app/build.gradle.kts')
          text = path.read_text()

          flavor_pattern = re.compile(
              r'(create\("gplay"\)\s*\{\s*applicationId\s*=\s*")com\.nextcloud\.talk2(")',
              re.MULTILINE,
          )
          text, flavor_count = flavor_pattern.subn(r'\1com.nextcloud.talk2.auto\2', text, count=1)
          if flavor_count != 1:
              raise SystemExit(f'Expected one gplay applicationId, patched {flavor_count}')

          version_pattern = re.compile(r'(?m)^(\s*versionCode\s*=\s*)(\d+)\s*$')
          match = version_pattern.search(text)
          if not match:
              raise SystemExit('Could not locate base versionCode')
          upstream_version = int(match.group(2))
          play_version = max(upstream_version + 1, 250020000 + int(os.environ['GITHUB_RUN_NUMBER']))
          text, version_count = version_pattern.subn(rf'\g<1>{play_version}', text, count=1)
          if version_count != 1:
              raise SystemExit(f'Expected one base versionCode, patched {version_count}')

          path.write_text(text)
          print('Play applicationId: com.nextcloud.talk2.auto')
          print(f'Upstream versionCode: {upstream_version}')
          print(f'Play versionCode: {play_version}')
          PY

      - name: Build GPlay release AAB for Play Console
        run: ./gradlew --no-daemon --no-build-cache :app:bundleGplayRelease --stacktrace

      - name: Sign Play AAB with persistent Talk Auto upload key
        shell: bash
        env:
          ANDROID_AUTO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_AUTO_KEYSTORE_PASSWORD }}
          ANDROID_AUTO_KEY_PASSWORD: ${{ secrets.ANDROID_AUTO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_aab=$(find app/build/outputs/bundle/gplayRelease -maxdepth 1 -type f -name '*.aab' ! -name 'Nextcloud-Talk-Android-Auto-PlayUpload.aab' | head -n1)
          [ -n "$unsigned_aab" ] || { echo 'ERROR: GPlay release AAB was not produced'; exit 1; }
          signed_aab=app/build/outputs/bundle/gplayRelease/Nextcloud-Talk-Android-Auto-PlayUpload.aab
          jarsigner \
            -keystore /tmp/talk-auto-signing.jks \
            -storepass "$ANDROID_AUTO_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_AUTO_KEY_PASSWORD" \
            -signedjar "$signed_aab" "$unsigned_aab" talk-auto
          jarsigner -verify -verbose -certs "$signed_aab"
          rm -f /tmp/talk-auto-signing.jks

      - name: Upload Play Console AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Nextcloud-Talk-Android-Auto-PlayUpload-AAB
          path: app/build/outputs/bundle/gplayRelease/Nextcloud-Talk-Android-Auto-PlayUpload.aab
          if-no-files-found: error
          retention-days: 14
