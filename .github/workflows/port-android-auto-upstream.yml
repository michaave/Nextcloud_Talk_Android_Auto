name: Port Android Auto onto current upstream

on:
  workflow_dispatch:
  push:
    branches:
      - android-auto-sync-work
    paths:
      - .github/workflows/port-android-auto-upstream.yml

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android Auto integration branch
        uses: actions/checkout@v6
        with:
          ref: android-auto-carappservice
          fetch-depth: 0

      - name: Fetch current upstream Talk master
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/nextcloud/talk-android.git || true
          git fetch upstream master

      - name: Merge upstream while preserving repository workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-commit --no-ff upstream/master; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              echo "Resolving upstream overlap: $path"
              git checkout --theirs -- "$path"
              git add "$path"
            done < <(git diff --name-only --diff-filter=U)
          fi
          git checkout HEAD -- .github/workflows
          git add .github/workflows

      - name: Reapply Android Auto Gradle and manifest foundation
        run: python tools/android_auto_bootstrap.py

      - name: Adapt current upstream CallActivity initialization
        run: python scripts/android-auto-adapt-current-upstream.py

      - name: Reapply Talk/Core-Telecom bridge hooks
        run: python scripts/android-auto-wire-call-bridge.py

      - name: Refresh dependency verification metadata
        run: ./gradlew --no-daemon --write-verification-metadata sha256 :app:dependencies >/tmp/dependencies.log

      - name: Commit and push synchronized Talk source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git reset HEAD -- .github/workflows
          git checkout HEAD -- .github/workflows
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'Android Auto branch is already synchronized with upstream.'
            git merge --abort 2>/dev/null || true
            exit 0
          fi
          git commit -m 'Merge current upstream Talk into Android Auto build'
          git push origin HEAD:android-auto-carappservice
