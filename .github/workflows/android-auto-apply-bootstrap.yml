name: Android Auto - apply bootstrap

on:
  push:
    branches:
      - android-auto
    paths:
      - .github/workflows/android-auto-apply-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: android-auto
          fetch-depth: 0

      - name: Apply Android Auto bootstrap
        run: python3 tools/android_auto_bootstrap.py

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/gplay
          if git diff --cached --quiet; then
            echo "Bootstrap already applied."
            exit 0
          fi
          git commit -m "feat(auto): add Car App and Telecom foundation"
          git push origin HEAD:android-auto
