name: Android Auto - update dependency verification

on:
  push:
    branches:
      - android-auto
    paths:
      - .github/workflows/android-auto-update-verification.yml

permissions:
  contents: write

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: android-auto
          fetch-depth: 0

      - name: Generate verification metadata for Android Auto dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --write-verification-metadata sha256,pgp :app:compileGplayDebugKotlin --stacktrace

      - name: Commit verification metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml gradle/verification-keyring.keys 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No verification metadata changes were necessary."
            exit 0
          fi
          git commit -m "build(auto): trust AndroidX Car dependencies"
          git push origin HEAD:android-auto
